<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seal Widget</title>
  <link rel="preload" as="image" href="seal_eyes_open.png" />
  <link rel="preload" as="image" href="seal.png" />
  <link rel="preload" as="image" href="seal_looking_side.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="seal-container">
    <img class="seal-layer active" data-state="idle"    src="seal_eyes_open.png"    alt="idle"    draggable="false" />
    <img class="seal-layer"        data-state="blink"   src="seal.png"              alt="blink"   draggable="false" />
    <img class="seal-layer"        data-state="looking" src="seal_looking_side.png" alt="looking" draggable="false" />
  </div>
  <script src="renderer.js"></script>
</body>
</html>
